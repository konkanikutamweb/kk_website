<div class="section-wrapper">
  <div class="section-header">
    <!-- <div class="divider"><span>✦</span></div> -->
    <h2>Our <em>Gallery</em></h2>
    <p>Cherished moments from our celebrations — a glimpse into the warmth and joy of Konkani Kutam.</p>
  </div>

  <div class="gallery-filters">
    <button class="filter-btn active" onclick="filterGallery('all', this)">All</button>
    <button class="filter-btn" onclick="filterGallery('monthi-fest', this)">Monthi Fest</button>
    <button class="filter-btn" onclick="filterGallery('summer-fest', this)">Summer Fest</button>
    <button class="filter-btn" onclick="filterGallery('christmas', this)">Christmas</button>
    <button class="filter-btn" onclick="filterGallery('easter', this)">Easter</button>
    <button class="filter-btn" onclick="filterGallery('other-events', this)">Other Events</button>
  </div>

  <!-- Year sub-filter — only visible when Monthi Fest is selected -->
  <div class="gallery-year-filters" id="monthiYearFilters">
    <button class="year-btn active" data-year="2025" onclick="filterMonthiFestYear('2025', this)">2025</button>
    <button class="year-btn" data-year="2024" onclick="filterMonthiFestYear('2024', this)">2024</button>
    <button class="year-btn" data-year="2023" onclick="filterMonthiFestYear('2023', this)">2023</button>
    <button class="year-btn" data-year="2022" onclick="filterMonthiFestYear('2022', this)">2022</button>
    <button class="year-btn" data-year="2019" onclick="filterMonthiFestYear('2019', this)">2019</button>
    <button class="year-btn" data-year="2018" onclick="filterMonthiFestYear('2018', this)">2018</button>
    <button class="year-btn" data-year="2017" onclick="filterMonthiFestYear('2017', this)">2017</button>
    <button class="year-btn" data-year="2016" onclick="filterMonthiFestYear('2016', this)">2016</button>
    <button class="year-btn" data-year="2015" onclick="filterMonthiFestYear('2015', this)">2015</button>
    <button class="year-btn" data-year="2014" onclick="filterMonthiFestYear('2014', this)">2014</button>
    <button class="year-btn" data-year="2009" onclick="filterMonthiFestYear('2009', this)">2009</button>
    <button class="year-btn" data-year="2008" onclick="filterMonthiFestYear('2008', this)">2008</button>
    <button class="year-btn" data-year="2007" onclick="filterMonthiFestYear('2007', this)">2007</button>
    <button class="year-btn" data-year="2006" onclick="filterMonthiFestYear('2006', this)">2006</button>
    <button class="year-btn" data-year="2005" onclick="filterMonthiFestYear('2005', this)">2005</button>
  </div>

  <!-- Summer Fest sub-filter — only visible when Summer Fest is selected -->
  <div class="gallery-sub-filters" id="summerFestSubFilters">
    <button class="sub-btn active" data-sub="all" onclick="filterSummerFestSub('all', this)">All</button>
    <button class="sub-btn" data-sub="bbq-2026" onclick="filterSummerFestSub('bbq-2026', this)">BBQ 2026</button>
    <button class="sub-btn" data-sub="bbq-2025" onclick="filterSummerFestSub('bbq-2025', this)">BBQ 2025</button>
    <button class="sub-btn" data-sub="bbq-2023" onclick="filterSummerFestSub('bbq-2023', this)">BBQ 2023</button>
    <button class="sub-btn" data-sub="bbq-2018" onclick="filterSummerFestSub('bbq-2018', this)">BBQ 2018</button>
  </div>

  <!-- Christmas sub-filter — only visible when Christmas is selected -->
  <div class="gallery-sub-filters" id="christmasSubFilters">
    <button class="sub-btn active" data-sub="all" onclick="filterChristmasSub('all', this)">All</button>
    <button class="sub-btn" data-sub="christmas-2025" onclick="filterChristmasSub('christmas-2025', this)">Christmas 2025</button>
  </div>

  <!-- Easter sub-filter — only visible when Easter is selected -->
  <div class="gallery-sub-filters" id="easterSubFilters">
    <button class="sub-btn active" data-sub="all" onclick="filterEasterSub('all', this)">All</button>
    <button class="sub-btn" data-sub="easter-2026" onclick="filterEasterSub('easter-2026', this)">Easter 2026</button>
  </div>

  <!-- Other Events sub-filter — only visible when Other Events is selected -->
  <div class="gallery-sub-filters" id="otherEventsSubFilters">
    <button class="sub-btn active" data-sub="all" onclick="filterOtherEventsSub('all', this)">All</button>
    <button class="sub-btn" data-sub="one-day-tour-2018" onclick="filterOtherEventsSub('one-day-tour-2018', this)">One Day Tour 2018</button>
    <button class="sub-btn" data-sub="outing-2017" onclick="filterOtherEventsSub('outing-2017', this)">Outing 2017</button>
  </div>

  <!-- Static gallery grid (All / Summer Fest / Christmas / Easter) -->
  <div class="gallery-grid" id="galleryGrid">
    <div class="gallery-item" data-category="monthi-fest" onclick="openLightbox('Images/2025_monthi_festh.jpg', 'Monthi Fest 2025', 'September 2025')">
      <img src="Images/2025_monthi_festh.jpg" alt="Monthi Fest 2025" loading="lazy">
      <div class="gallery-caption">
        <h4>Monthi Fest 2025</h4>
        <span>September 2025</span>
      </div>
    </div>
    <div class="gallery-item" data-category="monthi-fest" onclick="openLightbox('Images/2025_monthi_fest_flowers.jpg', 'Monthi Fest — Harvest Flowers', 'September 2025')">
      <img src="Images/2025_monthi_fest_flowers.jpg" alt="Monthi Fest Flowers 2025" loading="lazy">
      <div class="gallery-caption">
        <h4>Monthi Fest — Harvest Flowers</h4>
        <span>September 2025</span>
      </div>
    </div>
    <div class="gallery-item" data-category="summer-fest" onclick="openLightbox('Images/2025_summer_fest.jpg', 'Summer Fest 2025', 'July 2025')">
      <img src="Images/2025_summer_fest.jpg" alt="Summer Fest 2025" loading="lazy">
      <div class="gallery-caption">
        <h4>Summer Fest 2025</h4>
        <span>July 2025</span>
      </div>
    </div>
    <div class="gallery-item" data-category="christmas" onclick="openLightbox('Images/2025_christmas.jpg', 'Christmas Celebration 2025', 'December 2025')">
      <img src="Images/2025_christmas.jpg" alt="Christmas 2025" loading="lazy">
      <div class="gallery-caption">
        <h4>Christmas Celebration 2025</h4>
        <span>December 2025</span>
      </div>
    </div>
    <div class="gallery-item" data-category="easter" onclick="openLightbox('Images/2026_easter_gathering.jpg', 'Easter Gathering 2026', 'April 2026')">
      <img src="Images/2026_easter_gathering.jpg" alt="Easter Gathering 2026" loading="lazy">
      <div class="gallery-caption">
        <h4>Easter Gathering 2026</h4>
        <span>April 2026</span>
      </div>
    </div>
  </div>

  <!-- Dynamic Monthi Fest year gallery (populated by JS) -->
  <div class="gallery-grid" id="monthiFestGrid" style="display:none"></div>
</div>
